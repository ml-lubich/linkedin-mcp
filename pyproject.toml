[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-mcp"
version = "0.2.0"
description = "LinkedIn CLI + MCP server: feed/profile/search/social actions over the Voyager API, plus CDP-driven messaging, referrals, and posting against your own logged-in Chrome"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ml-lubich" }]
keywords = ["linkedin", "cli", "mcp", "social", "feed", "automation", "cdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "browser-cookie3>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
    "linkedin-api>=2.2.0",
    "lxml>=5.3",
    "mcp>=1.2",
    "own-chrome @ git+https://github.com/ml-lubich/own-chrome",
    "playwright>=1.52",
    "PyYAML>=6.0",
    "requests>=2.32",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/linkedin-mcp"
Repository = "https://github.com/ml-lubich/linkedin-mcp"
Issues = "https://github.com/ml-lubich/linkedin-mcp/issues"
Documentation = "https://github.com/ml-lubich/linkedin-mcp#readme"
Changelog = "https://github.com/ml-lubich/linkedin-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/ml-lubich/linkedin-mcp/security"

[project.scripts]
linkedin = "linkedin_mcp.cli:app"
linkedin-mcp = "linkedin_mcp.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["linkedin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["linkedin_mcp"]

[tool.ruff]
line-length = 100

[tool.mutmut]
source_paths = ["linkedin_mcp"]
only_mutate = [
    "linkedin_mcp/guard.py",
    "linkedin_mcp/core.py",
    "linkedin_mcp/mcp_server.py",
    "linkedin_mcp/auth_capture.py",
    "linkedin_mcp/scan.py",
    "linkedin_mcp/messaging.py",
    "linkedin_mcp/messages_actions.py",
    "linkedin_mcp/cli.py",
    "linkedin_mcp/governor.py",
    "linkedin_mcp/post_cdp.py",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
]
